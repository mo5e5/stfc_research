[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stfc-research"
version = "0.2.0"
description = "Derive scaling formulas for STFC armada strengths from battle report CSVs"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
